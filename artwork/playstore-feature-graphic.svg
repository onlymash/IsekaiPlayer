<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">

    <defs>
        <!-- Background Linear Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080512"/>
            <stop offset="50%" stop-color="#140B2D"/>
            <stop offset="100%" stop-color="#090E20"/>
        </linearGradient>

        <!-- Title Text Gradient -->
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="60%" stop-color="#E2C4FF"/>
            <stop offset="100%" stop-color="#80E5FF"/>
        </linearGradient>

        <!-- Magic Glow Radial Gradients -->
        <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.35"/>
            <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#080512" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
            <stop offset="30%" stop-color="#B388FF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
        </radialGradient>

        <!-- Soft Drop Shadow Filter -->
        <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C4DFF" flood-opacity="0.6"/>
        </filter>
    </defs>
    
